<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Jugnu — finds the teachers who have cracked foundational learning in every block, learns what they do, and spreads it." />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#060b14" />
    <title>Jugnu · जुगनू</title>
    <script>
      // Apply the saved colour mode before the first paint (no flash of the wrong theme).
      try {
        var m = localStorage.getItem("jugnu-mode") === "light" ? "light" : "dark";
        document.documentElement.dataset.mode = m;
        if (m === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f6f5f0");
      } catch (e) {}
    </script>
    <!-- Link previews (WhatsApp, social): the share card is public/og.jpg -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jugnu · जुगनू" />
    <meta property="og:title" content="Jugnu · जुगनू — the answer is often already in the block" />
    <meta property="og:description" content="Finds the teachers who already get children reading and counting, learns exactly what they do, and spreads it to nearby schools — teacher to teacher." />
    <meta property="og:image" content="https://jugnu-nine.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
