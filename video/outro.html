<html><head><meta charset="utf-8"><title>Jugnu outro</title>

<style>
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;max-width:1920px;aspect-ratio:16/9;height:auto}
  body.render canvas{width:1920px;height:1080px}
  #track{position:fixed;left:0;right:0;bottom:0;height:3px;background:#222}
  #bar{height:100%;background:#facc15;width:0}
  body.render #track{display:none}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="track"><div id="bar"></div></div>
<script>if(new URLSearchParams(location.search).has("render"))document.body.classList.add("render")</script>
<script type="module" src="./outro.js"></script>
